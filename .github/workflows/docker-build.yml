name: Build and Publish Docker Image

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - run: go test -race ./...
      - run: go vet ./...
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/*.test.cjs

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ghcr.io 要求镜像名全小写，仓库名 Cline-proxy 需要转成 cline-proxy
      - name: Normalize image name
        id: image
        run: echo "name=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      # 从 version.go 读出源码里的版本号（唯一来源），供镜像标签与构建参数使用。
      # 之前镜像只有在打 Git tag 时才会带上版本标签，分支构建只有 latest / sha。
      - name: Read version from version.go
        id: ver
        run: |
          version="$(grep -oP '^var Version = "\K[^"]+' cmd/cline-proxy/version.go)"
          if [ -z "$version" ]; then
            echo "::error::无法从 cmd/cline-proxy/version.go 解析版本号"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "源码版本号: $version"

      - name: Extract metadata (tags/labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}
          tags: |
            # 打 Git tag 时：tag 名去掉 v（v1.3.1 → 1.3.1）
            type=semver,pattern={{version}}
            # 分支构建时：用 version.go 里的版本号（每次提交都会递增）。
            # 打 Git tag 时禁用这条——否则会额外打出一个取自 version.go 的标签，
            # 一旦 tag 与源码版本不一致就会产生指向错误版本的镜像。
            type=raw,value=${{ steps.ver.outputs.version }},enable=${{ !startsWith(github.ref, 'refs/tags/') }}
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha

      # 构建参数：打 tag 时用 tag 名（权威），否则用源码版本号；
      # 两者在生产镜像里应保持一致。
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || steps.ver.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
